name: Apply Grimmory CBX file progress fix

on:
  push:
    branches:
      - fix/cbx-progress-sync
    paths:
      - .github/scripts/patch_grimmory_cbx_file_progress.py
      - .github/workflows/apply-grimmory-cbx-file-progress-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cbx-progress-sync
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python .github/scripts/patch_grimmory_cbx_file_progress.py

      - name: Validate
        run: |
          python -m py_compile src/api/booklore_client.py
          grep -q 'cbxProgress+fileProgress' src/api/booklore_client.py
          grep -q 'Grimmory CBX verify comparison' src/api/booklore_client.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-grimmory-cbx-file-progress-fix.yml
          git rm .github/scripts/patch_grimmory_cbx_file_progress.py
          git add src/api/booklore_client.py
          git commit -m "Fix Grimmory CBX reader progress writes"
          git push origin HEAD:fix/cbx-progress-sync
