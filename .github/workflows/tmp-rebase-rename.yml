name: Temporary rename rebase helper

on:
  push:
    branches:
      - tmp/rebase-helper

permissions:
  contents: write

jobs:
  diagnose-rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cporcellijr/bookbridge.git || true
          git fetch upstream dev
          git fetch origin fix/grimmory-mapping-rename-resilience

      - name: Replay rename commits and print first conflict
        shell: bash
        run: |
          set -u
          git checkout -B tmp-rename-result upstream/dev
          commits=(
            cc6f697981e2184bec50dbff029c8bdfa31391bc
            63548376a550ad2d91bfea009883c54c66a1bf64
            ddb22a15fbaf120e091552b855e918350c883cdc
            d2944cb133c6297b2a536d4e6dfe3d31185ff2dc
          )
          for c in "${commits[@]}"; do
            echo "=== cherry-pick $c ==="
            if ! git cherry-pick "$c"; then
              echo "=== STATUS ==="
              git status --short
              echo "=== CONFLICT DIFF ==="
              git diff --cc -- src/api/kosync_server.py src/sync_manager.py src/web_server.py || true
              echo "=== CONFLICT MARKERS ==="
              grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' src/api/kosync_server.py src/sync_manager.py src/web_server.py || true
              exit 1
            fi
          done
          git log --oneline -5
