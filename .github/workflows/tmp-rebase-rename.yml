name: Temporary final PR validation

on:
  push:
    branches:
      - tmp/rebase-helper

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - fix/cbz-grimmory-kosync
          - fix/grimmory-mapping-rename-resilience
          - fix/grimmory-ebook-cover-routing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install standard-image test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check out feature branch and current upstream dev
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cporcellijr/bookbridge.git || true
          git fetch upstream dev
          git fetch origin "${{ matrix.branch }}"
          git checkout --detach "origin/${{ matrix.branch }}"
          counts=$(git rev-list --left-right --count upstream/dev...HEAD)
          echo "upstream-only / feature-only: $counts"
          test "$counts" = $'0\t1'
          git diff --check upstream/dev..HEAD
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src tests; then
            echo "Conflict markers remain" >&2
            exit 1
          fi

      - name: Focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.branch }}" in
            fix/cbz-grimmory-kosync)
              python -m pytest -q \
                tests/test_cbz_fixed_page_progress.py \
                tests/test_kavita_sync_client.py \
                tests/test_kosync_sync_client_canonical.py \
                tests/test_booklore_client.py \
                tests/test_sync_manager_parser_routing.py
              ;;
            fix/grimmory-mapping-rename-resilience)
              python -m pytest -q \
                tests/test_grimmory_mapping_rename_resilience.py \
                tests/test_mapping_status_reuse.py \
                tests/test_booklore_client.py \
                tests/test_bookorbit_api_only_acquisition.py \
                tests/test_bookorbit_match_hash.py \
                tests/test_sync_manager_parser_routing.py \
                tests/test_observation_trail.py
              ;;
            fix/grimmory-ebook-cover-routing)
              python -m pytest -q \
                tests/test_booklore_client.py \
                tests/test_dashboard_cover_url_exposure.py \
                tests/test_multiuser_auth.py
              ;;
          esac

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Full standard-image test suite
        run: python -m pytest -q --ignore=tests/test_ctc_preflight.py
