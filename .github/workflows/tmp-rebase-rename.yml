name: Temporary rename rebase helper

on:
  push:
    branches:
      - tmp/rebase-helper

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cporcellijr/bookbridge.git || true
          git fetch upstream dev
          git fetch origin fix/grimmory-mapping-rename-resilience

      - name: Replay and squash onto current dev
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B tmp-rename-result upstream/dev
          git cherry-pick cc6f697981e2184bec50dbff029c8bdfa31391bc
          git cherry-pick 63548376a550ad2d91bfea009883c54c66a1bf64

          if ! git cherry-pick ddb22a15fbaf120e091552b855e918350c883cdc; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "src/api/kosync_server.py" ]; then
              echo "Unexpected conflicts: $conflicts" >&2
              git diff --cc || true
              exit 1
            fi
            git checkout --ours src/api/kosync_server.py
            if ! grep -q '^from src.utils.ebook_sources import is_grimmory_source$' src/api/kosync_server.py; then
              sed -i '/^from src.utils.string_utils import calculate_similarity, clean_book_title$/a from src.utils.ebook_sources import is_grimmory_source' src/api/kosync_server.py
            fi
            old='booklore_ebook_id=ebook_source_id if ebook_source == "BookLore" else None,'
            new='booklore_ebook_id=ebook_source_id if is_grimmory_source(ebook_source) else None,'
            if ! grep -Fq "$old" src/api/kosync_server.py; then
              echo "Expected BookLore source-id assignment not found" >&2
              exit 1
            fi
            sed -i "s/$old/$new/" src/api/kosync_server.py
            git add src/api/kosync_server.py
            git cherry-pick --continue
          fi

          git cherry-pick d2944cb133c6297b2a536d4e6dfe3d31185ff2dc

          git reset --soft upstream/dev
          git commit -m "[Fix] Keep Grimmory mappings stable across filename changes" -m "Use stable Grimmory source ids for mapped progress reads and writes, reconcile same-id filename drift without remapping, preserve local and KoSync identity, and harden legacy exact-match backfill and source normalization."

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src tests; then
            echo "Conflict markers remain" >&2
            exit 1
          fi
          git diff upstream/dev..HEAD --check

      - name: Focused regression tests
        run: |
          python -m pytest -q \
            tests/test_grimmory_mapping_rename_resilience.py \
            tests/test_mapping_status_reuse.py \
            tests/test_booklore_client.py \
            tests/test_bookorbit_api_only_acquisition.py \
            tests/test_bookorbit_match_hash.py \
            tests/test_sync_manager_parser_routing.py \
            tests/test_observation_trail.py

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Full standard-image test suite
        run: python -m pytest -q --ignore=tests/test_ctc_preflight.py

      - name: Push validated temporary result
        run: git push --force origin HEAD:refs/heads/tmp/rename-rebased-result
