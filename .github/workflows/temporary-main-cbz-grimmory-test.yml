name: Temporary main CBZ Grimmory integration image

on:
  push:
    branches:
      - test/main-cbz-grimmory-integration
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push temporary NAS test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:main-cbz-grimmory-test
          build-args: |
            APP_VERSION=main-cbz-grimmory-test-${{ github.sha }}
            INSTALL_GPU=false
          cache-from: type=gha,scope=main-cbz-grimmory-test
          cache-to: type=gha,mode=max,scope=main-cbz-grimmory-test
