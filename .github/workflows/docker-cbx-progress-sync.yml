name: Build CBX progress sync test image

on:
  push:
    branches:
      - fix/cbx-progress-sync
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cbx-progress-sync-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=cbx-progress-sync
            type=sha,prefix=cbx-progress-sync-

      # This branch image is intentionally rebuilt after each test-fix commit.
      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cbx-progress-sync
          cache-to: type=gha,mode=max,scope=cbx-progress-sync
          build-args: |
            APP_VERSION=cbx-progress-sync
            INSTALL_GPU=false
